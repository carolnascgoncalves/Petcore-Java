<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Detalhes do Medicamento - PetCore')}"></head>

<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">

    <div class="pagina-cabecalho">
        <div>
            <span class="pagina-etiqueta">CATÁLOGO</span>
            <h1>Detalhes do medicamento</h1>
            <p>Consulte as informações do medicamento cadastrado.</p>
        </div>

        <a th:href="@{/medicamento/listar}" class="botao botao-secundario">
            ← Voltar
        </a>
    </div>

    <section class="perfil-usuario">

        <div class="historico-identificacao">
            <div class="historico-pet-icone">💊</div>

            <div>
                <span class="pagina-etiqueta">MEDICAMENTO</span>
                <h2 th:text="${medicamento.nome}"></h2>
                <p>Informações do catálogo de medicamentos.</p>
            </div>
        </div>

        <div class="detalhes-grid">

            <div class="detalhe-item">
                <span>Nome</span>
                <strong th:text="${medicamento.nome}"></strong>
            </div>

            <div class="detalhe-item">
                <span>Dosagem</span>
                <strong th:text="${medicamento.dosagem}"></strong>
            </div>

        </div>

        <div class="perfil-acoes">
            <a th:href="@{/medicamento/editar/{id}(id=${medicamento.id})}"
               class="botao botao-principal">
                Editar medicamento
            </a>
        </div>

    </section>

</main>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>

</body>
</html>
