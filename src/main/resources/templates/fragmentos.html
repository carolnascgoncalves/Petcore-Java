<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo}">PetCore</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>

<body>

<header th:fragment="menu" class="topo">
    <div class="topo-conteudo">

        <a th:href="@{/home}" class="marca">
            <span class="marca-icone">P</span>
            <span class="marca-texto">PET<span>CORE</span></span>
        </a>

        <nav class="navegacao">
            <a th:href="@{/home}">Início</a>
            <a th:href="@{/pet/listar}">Pets</a>
            <a th:href="@{/historico/listar}">Históricos</a>
            <a th:href="@{/exame/listar}">Exames</a>
            <a th:href="@{/receita/listar}">Receitas</a>
        </nav>

        <form th:action="@{/logout}" method="post" class="form-logout">
            <button type="submit" class="botao-sair">Sair <span>↗</span></button>
        </form>

    </div>
</header>

<script th:fragment="bootstrap-script"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
