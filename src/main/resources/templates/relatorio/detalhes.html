<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Detalhes do Relatório - PetCore')}"></head>

<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">

    <div class="pagina-cabecalho">
        <div>
            <span class="pagina-etiqueta">DOCUMENTAÇÃO</span>
            <h1>Detalhes do relatório</h1>
            <p>Consulte as informações e os vínculos deste registro.</p>
        </div>

        <a th:href="@{/relatorio/listar}" class="botao botao-secundario">
            ← Voltar
        </a>
    </div>

    <section class="perfil-usuario">

        <div class="historico-identificacao">
            <div class="historico-pet-icone">📊</div>

            <div>
                <span class="pagina-etiqueta">RELATÓRIO</span>
                <h2>Registro clínico</h2>
                <p th:text="${relatorio.dataFormatada}"></p>
            </div>
        </div>

        <div class="detalhes-grid">

            <div class="detalhe-item">
                <span>Data de criação</span>
                <strong th:text="${relatorio.dataFormatada}"></strong>
            </div>

            <div class="detalhe-item">
                <span>Pet</span>
                <strong th:text="${relatorio.historico != null && relatorio.historico.pet != null ? relatorio.historico.pet.nome : 'Sem pet'}"></strong>
            </div>

            <div class="detalhe-item">
                <span>Médico responsável</span>
                <strong th:text="${relatorio.medico != null ? relatorio.medico.nome : 'Sem médico'}"></strong>
            </div>

        </div>

        <div class="bloco-instrucao">
            <span>Observações</span>
            <p th:text="${relatorio.observacao}"></p>
        </div>

        <div class="perfil-acoes"
             th:if="${relatorio.historico != null and relatorio.historico.pet != null and relatorio.historico.pet.status.name() == 'ATIVO'}">

            <a th:href="@{/relatorio/editar/{id}(id=${relatorio.id})}"
               class="botao botao-principal">
                Editar relatório
            </a>

        </div>

    </section>

</main>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>

</body>
</html>
