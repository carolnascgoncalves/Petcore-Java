<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Detalhes da Clínica - PetCore')}"></head>

<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">

    <div class="pagina-cabecalho">
        <div>
            <span class="pagina-etiqueta">ESTABELECIMENTO</span>
            <h1>Detalhes da clínica</h1>
            <p>Consulte os dados cadastrais e o endereço da clínica.</p>
        </div>

        <a th:href="@{/clinica/listar}" class="botao botao-secundario">
            ← Voltar
        </a>
    </div>

    <section class="perfil-usuario">

        <div class="historico-identificacao">
            <div class="historico-pet-icone">🏥</div>

            <div>
                <span class="pagina-etiqueta">CLÍNICA</span>
                <h2 th:text="${clinica.nome}"></h2>
                <p>Estabelecimento cadastrado no PetCore</p>
            </div>
        </div>

        <div class="detalhes-grid">

            <div class="detalhe-item">
                <span>Nome</span>
                <strong th:text="${clinica.nome}"></strong>
            </div>

            <div class="detalhe-item">
                <span>CNPJ</span>
                <strong th:text="${clinica.cnpj}"></strong>
            </div>

            <div class="detalhe-item">
                <span>CEP</span>
                <strong th:text="${clinica.endereco != null ? clinica.endereco.cep : 'Sem endereço'}"></strong>
            </div>

            <div class="detalhe-item">
                <span>Complemento</span>
                <strong th:text="${clinica.endereco != null && clinica.endereco.complemento != null ? clinica.endereco.complemento : 'Sem complemento'}"></strong>
            </div>

        </div>

        <div class="perfil-acoes">
            <a th:href="@{/clinica/editar/{id}(id=${clinica.id})}"
               class="botao botao-principal">
                Editar clínica
            </a>
        </div>

    </section>

</main>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>

</body>
</html>
