<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragmentos :: cabecalho('Editar Tutor - PetCore')}"></head>

<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">

    <div class="pagina-cabecalho">
        <div>
            <span class="pagina-etiqueta">CONFIGURAÇÕES DA CONTA</span>
            <h1>Editar meus dados</h1>
            <p>Atualize suas informações pessoais.</p>
        </div>

        <a th:href="@{/tutor/minha-conta}" class="botao botao-secundario">
            ← Voltar
        </a>
    </div>

    <section class="formulario-card">

        <form th:action="@{/tutor/atualizar}"
              th:object="${tutor}"
              method="post">

            <div class="formulario-secao">

                <div class="secao-titulo">
                    <h2>Informações de acesso</h2>
                    <p>Atualize seu email e telefone.</p>
                </div>

                <div class="formulario-grid">

                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" th:field="*{email}">
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('email')}"
                              th:errors="*{email}"></span>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone"
                               th:field="*{telefone}" maxlength="11">
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('telefone')}"
                              th:errors="*{telefone}"></span>
                    </div>

                    <div class="campo campo-largo">
                        <label for="senha">Nova senha</label>
                        <input type="password" id="senha"
                               th:field="*{senha}"
                               placeholder="Deixe em branco para manter a senha atual">
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('senha')}"
                              th:errors="*{senha}"></span>
                    </div>

                </div>

            </div>

            <div class="formulario-acoes">
                <a th:href="@{/tutor/minha-conta}" class="botao botao-secundario">
                    Cancelar
                </a>

                <button type="submit" class="botao botao-principal">
                    Salvar alterações
                </button>
            </div>

        </form>

    </section>

</main>

<script th:replace="~{fragmentos :: bootstrap-script}"></script>

</body>
</html>
