
spring.application.name=challenge_petcore

# Conexao com Oracle FIAP
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl
spring.datasource.username=rm564786
spring.datasource.password=${ORACLE_DB_PASSWORD}

# Configuracoes do Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none

# Exibicao do SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway temporariamente desativado
spring.flyway.enabled=false

# Upload de imagens dos pets
petcore.upload-dir=uploads/pets

# Upload de imagens dos tutores e médicos
petcore.upload-dir-usuarios=uploads/usuarios

# Limite de tamanho das imagens
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Porta dinâmica para hospedagem
server.port=${PORT:8080}